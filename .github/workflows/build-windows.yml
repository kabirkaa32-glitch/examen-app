name: Build Windows Installer

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.2.0 && git push origin v1.2.0
  workflow_dispatch:      # manual run from the Actions tab
    inputs:
      version:
        description: "Version number (e.g. 1.2.0)"
        required: false
        default: "1.2.0"

permissions:
  contents: write         # needed to publish a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Resolve version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          elseif ($env:INPUT_VERSION) { $v = $env:INPUT_VERSION }
          else { $v = '1.2.0' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $v (use X.Y.Z)" }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Version: $v"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
          python -c "import PySide6, cryptography; from PySide6.QtWebEngineWidgets import QWebEngineView; from PySide6.QtPrintSupport import QPrinter; print('Dependencies OK')"

      - name: Download offline assets (Excel library + Arabic fonts)
        run: python tools/fetch_assets.py

      - name: Embed renderer inside the EXE
        run: python tools/pack_renderer.py

      - name: Build EXE (PyInstaller)
        run: pyinstaller --noconfirm --clean guard_app.spec

      - name: Verify build output
        shell: pwsh
        run: |
          $d = 'dist/GuardApp'
          if (Test-Path "$d/_internal/renderer") { throw 'renderer folder must not ship as loose files' }
          foreach ($f in 'GuardApp.exe', '_internal/schema.sql', '_internal/assets/icon.ico', '_internal/assets/icon.png', '_internal/fonts/fonts.css') {
            if (-not (Test-Path "$d/$f")) { throw "Missing in build: $f" }
          }
          python tools/check_icon.py dist/GuardApp/GuardApp.exe
          if ($LASTEXITCODE -ne 0) { throw 'Icon check failed' }

      - name: Smoke test (local server, SQLite, offline assets)
        continue-on-error: true      # informational: does not block the installer
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          $p = Start-Process -FilePath 'dist/GuardApp/GuardApp.exe' -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18764/api/load' -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'local server did not answer' }
          $html = (Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18764/').Content
          if ($html -notmatch 'window.print=function') { throw 'print bridge not injected' }
          $x = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18764/vendor/xlsx.full.min.js'
          if ($x.Content.Length -lt 400000) { throw 'xlsx library not embedded' }
          $f = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18764/fonts/fonts.css'
          Write-Host "fonts.css bytes: $($f.Content.Length)"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'SMOKE TEST OK'

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $p1 = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $p2 = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          if (-not ((Test-Path $p1) -or (Test-Path $p2))) { choco install innosetup --no-progress -y }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "installer\guard_app.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (-not (Test-Path 'installer_output/GuardApp-Setup.exe')) { throw 'GuardApp-Setup.exe was not produced' }

      # يُنشر الملف كأصل (Asset) في صفحة Release: تحميل مباشر لـ GuardApp-Setup.exe بدون ZIP
      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Exam Manager v${{ env.APP_VERSION }}
          body: |
            حمّل الملف **GuardApp-Setup.exe** أدناه ثم شغّله لتثبيت البرنامج.
          files: installer_output/GuardApp-Setup.exe
          make_latest: true
          fail_on_unmatched_files: true
